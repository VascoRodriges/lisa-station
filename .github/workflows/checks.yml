name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python tools/check_public_tree.py
      - run: python -m pytest -q
  controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install verified Zig 0.14.1
        run: |
          curl --fail --location --output zig.tar.xz https://ziglang.org/download/0.14.1/zig-x86_64-linux-0.14.1.tar.xz
          echo '24aeeec8af16c381934a6cd7d95c807a8cb2cf7df9fa40d359aa884195c4716c  zig.tar.xz' | sha256sum --check
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.14.1" >> "$GITHUB_PATH"
      - run: python controller/build.py
      - run: python controller/build.py --target net-owner-probe
      - run: python controller/build.py --target vendor-launch-probe
      - run: python controller/build.py --target mode-store-probe
      - run: python controller/build.py --target socket-close-probe
      - run: python controller/build.py --target flow-quarantine-probe
      - name: Exercise mode storage on the host
        run: |
          cc -O2 -Wall -Wextra -Werror controller/mode_store_probe.c -o build/mode-store-host
          ./build/mode-store-host
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: station-controller-armhf
          path: build/station-ctl.armhf
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: station-network-qualification-armhf
          path: build/net-owner-probe.armhf
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: station-startup-qualification-armhf
          path: build/vendor-launch-probe.armhf
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: station-mode-storage-qualification-armhf
          path: build/mode-store-probe.armhf
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: station-socket-close-qualification-armhf
          path: build/socket-close-probe.armhf
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: station-flow-quarantine-qualification-armhf
          path: build/flow-quarantine-probe.armhf
