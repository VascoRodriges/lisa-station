name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python tools/check_public_tree.py
      - run: python -m pytest -q
  controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install verified Zig 0.14.1
        run: |
          curl --fail --location --output zig.tar.xz https://ziglang.org/download/0.14.1/zig-x86_64-linux-0.14.1.tar.xz
          echo '24aeeec8af16c381934a6cd7d95c807a8cb2cf7df9fa40d359aa884195c4716c  zig.tar.xz' | sha256sum --check
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.14.1" >> "$GITHUB_PATH"
      - run: python controller/build.py
      - run: python controller/build.py --target net-owner-probe
      - run: python controller/build.py --target vendor-launch-probe
      - run: python controller/build.py --target mode-store-probe
      - run: python controller/build.py --target socket-close-probe
      - run: python controller/build.py --target flow-quarantine-probe
      - run: python controller/build.py --target service-profile-probe
      - run: python controller/build.py --target service-gate-probe
      - run: python controller/build.py --target startup-guardian-probe
      - run: python controller/build.py --target station-service
      - run: python controller/build.py --target closed-transition-probe
      - run: python controller/build.py --target open-transition-probe
      - run: python controller/build.py --target flow-store-probe
      - run: python controller/build.py --target closed-flow-probe
      - run: python controller/build.py --target tcp-evidence-probe
      - run: python controller/build.py --target diagnostics-guard-probe
      - run: python controller/build.py --target relay-evidence-probe
      - run: python controller/build.py --target collector-guard-probe
      - run: python controller/build.py --target telemetry-guard-probe
      - run: python controller/build.py --target unix-peer-probe
      - run: python controller/build.py --target composite-roles-probe
      - run: python controller/build.py --target ipc-guard-probe
      - run: python controller/build.py --target udp-evidence-probe
      - run: python controller/build.py --target connmark-probe
      - run: python controller/build.py --target label-policy-probe
      - run: python controller/build.py --target epoch-policy-probe
      - run: python controller/build.py --target epoch-mutation-probe
      - run: python controller/build.py --target platform-storage-probe
      - run: python controller/build.py --target station-init
      - run: python controller/build.py --target boot-runner-probe
      - run: python controller/build.py --target boot-dispatch-probe
      - run: python controller/build.py --target station-boot
      - run: python controller/build.py --target boot-state-probe
      - run: python controller/build.py --target auxiliary-probe
      - run: python controller/build.py --target dns-profile-probe
      - run: python controller/build.py --target time-guard-probe
      - run: python controller/build.py --target time-clock-proof
      - name: Exercise mode storage on the host
        run: |
          cc -O2 -Wall -Wextra -Werror controller/mode_store_probe.c -o build/mode-store-host
          ./build/mode-store-host
          cc -O2 -Wall -Wextra -Werror controller/service_gate_probe.c -o build/service-gate-host
          ./build/service-gate-host
          cc -O2 -D_FORTIFY_SOURCE=3 -fstack-protector-strong -Wall -Wextra -Werror controller/startup_guardian_probe.c -o build/startup-guardian-host
          ./build/startup-guardian-host
          cc -O2 -D_FORTIFY_SOURCE=3 -fstack-protector-strong -Wall -Wextra -Werror controller/closed_transition_probe.c -o build/closed-transition-host
          ./build/closed-transition-host
          cc -O2 -D_FORTIFY_SOURCE=3 -fstack-protector-strong -Wall -Wextra -Werror controller/open_transition_probe.c -o build/open-transition-host
          ./build/open-transition-host
          cc -O2 -D_FORTIFY_SOURCE=3 -fstack-protector-strong -Wall -Wextra -Werror controller/flow_store_probe.c -o build/flow-store-host
          ./build/flow-store-host
          cc -O2 -D_FORTIFY_SOURCE=3 -fstack-protector-strong -Wall -Wextra -Werror controller/closed_flow_probe.c -o build/closed-flow-host
          cc -O2 -D_FORTIFY_SOURCE=3 -fstack-protector-strong -Wall -Wextra -Werror controller/tcp_evidence_probe.c -o build/tcp-evidence-host
          ./build/tcp-evidence-host --selftest
          cc -O2 -D_FORTIFY_SOURCE=3 -fstack-protector-strong -Wall -Wextra -Werror controller/relay_evidence_probe.c -o build/relay-evidence-host
          ./build/relay-evidence-host --selftest
          cc -O2 -D_FORTIFY_SOURCE=3 -fstack-protector-strong -Wall -Wextra -Werror controller/unix_peer_probe.c -o build/unix-peer-host
          ./build/unix-peer-host --selftest
          cc -O2 -D_FORTIFY_SOURCE=3 -fstack-protector-strong -Wall -Wextra -Werror controller/composite_roles_probe.c -o build/composite-roles-host
          ./build/composite-roles-host
          cc -O2 -D_FORTIFY_SOURCE=3 -fstack-protector-strong -Wall -Wextra -Werror controller/ipc_guard_probe.c -o build/ipc-guard-host
          ./build/ipc-guard-host --selftest
          cc -O2 -D_FORTIFY_SOURCE=3 -fstack-protector-strong -Wall -Wextra -Werror controller/udp_evidence_probe.c -o build/udp-evidence-host
          ./build/udp-evidence-host --selftest
          cc -O2 -D_FORTIFY_SOURCE=3 -fstack-protector-strong -Wall -Wextra -Werror controller/connmark_probe.c -o build/connmark-host
          cc -O2 -D_FORTIFY_SOURCE=3 -fstack-protector-strong -Wall -Wextra -Werror controller/label_policy_probe.c -o build/label-policy-host
          ./build/label-policy-host
          cc -O2 -D_FORTIFY_SOURCE=3 -fstack-protector-strong -Wall -Wextra -Werror controller/epoch_policy_probe.c -o build/epoch-policy-host
          ./build/epoch-policy-host --selftest
          cc -O2 -D_FORTIFY_SOURCE=3 -fstack-protector-strong -Wall -Wextra -Werror controller/epoch_mutation_probe.c -o build/epoch-mutation-host
          ./build/epoch-mutation-host --selftest
          cc -O2 -D_FORTIFY_SOURCE=3 -fstack-protector-strong -Wall -Wextra -Werror controller/platform_storage_probe.c -o build/platform-storage-host
          ./build/platform-storage-host --selftest
          cc -O2 -D_FORTIFY_SOURCE=3 -fstack-protector-strong -Wall -Wextra -Werror controller/boot_runner_probe.c -o build/boot-runner-host
          chmod 700 build/boot-runner-host
          ./build/boot-runner-host
          cc -O2 -D_FORTIFY_SOURCE=3 -fstack-protector-strong -Wall -Wextra -Werror controller/station_init.c -o build/station-init-host
          cc -O2 -D_FORTIFY_SOURCE=3 -fstack-protector-strong -Wall -Wextra -Werror controller/boot_dispatch_probe.c -o build/boot-dispatch-host
          cc -O2 -D_FORTIFY_SOURCE=3 -fstack-protector-strong -Wall -Wextra -Werror controller/station_boot.c -o build/station-boot-host
          cc -O2 -D_FORTIFY_SOURCE=3 -fstack-protector-strong -Wall -Wextra -Werror controller/boot_state_probe.c -o build/boot-state-host
          ./build/boot-state-host
          cc -O2 -D_FORTIFY_SOURCE=3 -fstack-protector-strong -Wall -Wextra -Werror controller/auxiliary_probe.c -o build/auxiliary-host
          chmod 700 build/auxiliary-host
          ./build/auxiliary-host
          cc -O2 -D_FORTIFY_SOURCE=3 -fstack-protector-strong -Wall -Wextra -Werror controller/dns_profile_probe.c -o build/dns-profile-host
          ./build/dns-profile-host
          cc -O2 -D_FORTIFY_SOURCE=3 -fstack-protector-strong -Wall -Wextra -Werror controller/time_guard_probe.c -o build/time-guard-host
          ./build/time-guard-host
          cc -O2 -D_FORTIFY_SOURCE=3 -fstack-protector-strong -Wall -Wextra -Werror -shared -fPIC controller/time_clock_proof.c -ldl -o build/time-clock-proof-host.so
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: station-controller-armhf
          path: build/station-ctl.armhf
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: station-network-qualification-armhf
          path: build/net-owner-probe.armhf
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: station-startup-qualification-armhf
          path: build/vendor-launch-probe.armhf
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: station-mode-storage-qualification-armhf
          path: build/mode-store-probe.armhf
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: station-socket-close-qualification-armhf
          path: build/socket-close-probe.armhf
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: station-flow-quarantine-qualification-armhf
          path: build/flow-quarantine-probe.armhf
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: station-service-profiles-qualification-armhf
          path: build/service-profile-probe.armhf
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: station-service-gate-qualification-armhf
          path: build/service-gate-probe.armhf
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: station-startup-guardian-qualification-armhf
          path: build/startup-guardian-probe.armhf
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: station-service-backend-armhf
          path: build/station-service.armhf
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: station-closed-transition-qualification-armhf
          path: build/closed-transition-probe.armhf
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: station-flow-evidence-qualification-armhf
          path: build/flow-store-probe.armhf
      - uses: actions/upload-artifact@v7.0.2
        with:
